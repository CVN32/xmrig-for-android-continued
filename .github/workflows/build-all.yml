name: BuildAll

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: "17"
          cache: yarn

      - name: Restore native libs from last arm64 release APK
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/prev.apk \
            https://github.com/CVN32/xmrig-for-android-continued/releases/download/v0.2.4/xmrig-continued-0.2.4-arm64.apk
          mkdir -p /tmp/apkout
          unzip -qo /tmp/prev.apk 'lib/arm64-v8a/*' -d /tmp/apkout
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp /tmp/apkout/lib/arm64-v8a/*.so android/app/src/main/jniLibs/arm64-v8a/
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: Install JS deps
        run: yarn install --frozen-lockfile || yarn install

      - name: Assemble release APK
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Package artifact
        id: artifact
        run: |
          set -euo pipefail
          MAJOR=$(grep '^majorVersion=' version.properties | cut -d= -f2)
          MINOR=$(grep '^minorVersion=' version.properties | cut -d= -f2)
          PATCH=$(grep '^patchVersion=' version.properties | cut -d= -f2)
          VER="${MAJOR}.${MINOR}.${PATCH}"
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          OUT="xmrig-continued-${VER}-arm64.apk"
          cp "$SRC" "$OUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.artifact.outputs.ver }}
          name: v${{ steps.artifact.outputs.ver }} — UI redesign (Pool Presets + nav)
          prerelease: false
          files: ${{ steps.artifact.outputs.apk }}
          body: |
            ## UI redesign

            - Pool Presets: scrollable body, fixed Apply footer, dark elevated sheet + contrast fix
            - Bottom tabs unified: Miner | Log | Settings
            - Toast anchored above bottom tabs
            - Miner dashboard hierarchy / density cleanup

            ### Artifact
            - `xmrig-continued-${{ steps.artifact.outputs.ver }}-arm64.apk`
            - arm64-v8a · minifyEnabled false · debug-signed (same as recent continued releases)
            - Native libs reused from v0.2.4 package (UI-only release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
