name: BuildAll

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

concurrency:
  group: build-all-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "ndk;21.4.7075529" \
            "cmake;3.18.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "17"
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build current native miners
        env:
          ARCHS: arm64
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          cd xmrig/lib-builder
          make all
          test -x ../../android/app/src/main/jniLibs/arm64-v8a/libxmrig.so
          test -x ../../android/app/src/main/jniLibs/arm64-v8a/libxmrig-mo.so
          file ../../android/app/src/main/jniLibs/arm64-v8a/libxmrig.so
          file ../../android/app/src/main/jniLibs/arm64-v8a/libxmrig-mo.so

      - name: Assemble release APK
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          set -euo pipefail
          cd android
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload verification outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-outputs
          path: |
            android/app/build/outputs/**
            android/**/*.log
            xmrig/lib-builder/build/**/*.log
          if-no-files-found: ignore

  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "ndk;21.4.7075529" \
            "cmake;3.18.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "17"
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build current native miners
        env:
          ARCHS: arm64
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          cd xmrig/lib-builder
          make all
          test -x ../../android/app/src/main/jniLibs/arm64-v8a/libxmrig.so
          test -x ../../android/app/src/main/jniLibs/arm64-v8a/libxmrig-mo.so

      - name: Assemble release APK
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          set -euo pipefail
          cd android
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            android/app/build/outputs/**
            android/**/*.log
            xmrig/lib-builder/build/**/*.log
          if-no-files-found: ignore

      - name: Package artifact
        id: artifact
        run: |
          set -euo pipefail
          MAJOR=$(grep '^majorVersion=' version.properties | cut -d= -f2)
          MINOR=$(grep '^minorVersion=' version.properties | cut -d= -f2)
          PATCH=$(grep '^patchVersion=' version.properties | cut -d= -f2)
          VER="${MAJOR}.${MINOR}.${PATCH}"
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          OUT="xmrig-continued-${VER}-arm64.apk"
          cp "$SRC" "$OUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.artifact.outputs.ver }}
          name: v${{ steps.artifact.outputs.ver }}
          prerelease: false
          files: ${{ steps.artifact.outputs.apk }}
          body: |
            ## Artifact

            - `xmrig-continued-${{ steps.artifact.outputs.ver }}-arm64.apk`
            - arm64-v8a
            - Native XMRig binaries rebuilt from the source revisions in this release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
