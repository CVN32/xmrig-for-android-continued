name: BuildAll

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main

env:
  ANDROID_PLATFORM: android-29
  NDK_VERSION: 21.4.7075529
  ARCHS: arm64

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK / NDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.18.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "17"
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Lint UI and application code
        run: yarn lint

      - name: Build current native miners
        run: |
          set -euo pipefail
          cd xmrig/lib-builder
          make all
          test -x ../../android/app/src/main/jniLibs/arm64-v8a/libxmrig.so
          test -x ../../android/app/src/main/jniLibs/arm64-v8a/libxmrig-mo.so

      - name: Assemble arm64 release APK
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          set -euo pipefail
          cd android
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon \
            --stacktrace

      - name: Package artifact
        id: artifact
        run: |
          set -euo pipefail
          MAJOR=$(grep '^majorVersion=' version.properties | cut -d= -f2)
          MINOR=$(grep '^minorVersion=' version.properties | cut -d= -f2)
          PATCH=$(grep '^patchVersion=' version.properties | cut -d= -f2)
          VER="${MAJOR}.${MINOR}.${PATCH}"
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          OUT="xmrig-continued-${VER}-arm64.apk"
          cp "$SRC" "$OUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT" | tee "${OUT}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.artifact.outputs.ver }}
          name: v${{ steps.artifact.outputs.ver }} — UI layout and stability repair
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ steps.artifact.outputs.apk }}
            ${{ steps.artifact.outputs.apk }}.sha256
          body: |
            ## UI layout and stability repair

            - Pool Presets rebuilt as a centered modal with persistent Cancel / Apply actions
            - Preset switching no longer reuses stale pool state
            - Worker & config details render independently from live miner telemetry
            - Expanded miner statistics use responsive widths and safer summary access
            - Configuration creation avoids redundant selection dispatches
            - arm64-only APK with current native miners

            ### Artifact
            - `xmrig-continued-${{ steps.artifact.outputs.ver }}-arm64.apk`
            - ABI: `arm64-v8a`
            - Signing: Android debug keystore (continued-fork CI signing; not a production Play Store key)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
